name: Refresh README Screenshot

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-screenshot
  cancel-in-progress: false

jobs:
  capture:
    name: Capture homepage screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Capture screenshot
        run: npm run screenshots

      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: homepage-screenshots
          path: |
            assets/homepage-hero.png
            assets/homepage-mobile.png
            assets/homepage-full-page.png
          if-no-files-found: error

      - name: Publish screenshots
        if: github.ref == 'refs/heads/main'
        run: bash scripts/publish_screenshots.sh
