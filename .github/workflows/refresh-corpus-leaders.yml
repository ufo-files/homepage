name: Refresh Corpus Leaders

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-corpus-leaders
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.UFO_FILES_WORKFLOW_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run update:leaders
      - name: Commit changed rankings
        run: |
          if git diff --quiet -- data/corpus-leaders.json; then
            echo "Corpus leaders are already current."
            exit 0
          fi
          git config user.name "ufo-files"
          git config user.email "297273897+ufo-files@users.noreply.github.com"
          git add data/corpus-leaders.json
          git commit -m "Refresh homepage corpus leaders [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
