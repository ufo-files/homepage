<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Aged archival file folder</title>
  <desc id="desc">A plain warm paper folder with subtle fibers, creases, and worn edges.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9bd82"/>
      <stop offset=".48" stop-color="#d3b477"/>
      <stop offset="1" stop-color="#caa96d"/>
    </linearGradient>
    <linearGradient id="crease" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e4b20" stop-opacity="0"/>
      <stop offset=".48" stop-color="#6e4b20" stop-opacity=".13"/>
      <stop offset=".53" stop-color="#fff3ce" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff3ce" stop-opacity="0"/>
    </linearGradient>
    <filter id="fiber" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .34" numOctaves="3" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="roughen" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="8" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2"/>
    </filter>
    <pattern id="flecks" width="83" height="67" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="19" r=".8" fill="#6d4a24" opacity=".16"/>
      <circle cx="57" cy="43" r=".6" fill="#fff0c8" opacity=".22"/>
      <path d="M23 54h19M66 11h8" stroke="#725027" stroke-width=".6" opacity=".1"/>
    </pattern>
  </defs>
  <path d="M0 34H93L112 0h385l28 34H1600V1000H0Z" fill="url(#paper)" filter="url(#roughen)"/>
  <rect width="1600" height="1000" fill="url(#flecks)" filter="url(#fiber)" opacity=".72"/>
  <path d="M770 0c-18 157 22 311-5 478-24 148 26 340-8 522h110c-25-185 18-357-9-526-25-158 17-319-8-474z" fill="url(#crease)" opacity=".65"/>
  <path d="M5 950c328-13 546 11 792-3 252-15 474 17 798-1" fill="none" stroke="#7f5b2e" stroke-opacity=".1" stroke-width="5"/>
  <path d="M2 38c304 7 520-5 802 3 277 7 488-8 794-2" fill="none" stroke="#fff0c3" stroke-opacity=".17" stroke-width="3"/>
</svg>
